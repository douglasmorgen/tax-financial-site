<%
  require "dotenv"
  Dotenv.load(".kamal/deploy.env")
%>

service: finance

image: <%= ENV.fetch("KAMAL_IMAGE") %>

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER") %>
    proxy: false
    options:
      publish:
        - "127.0.0.1:<%= ENV.fetch("KAMAL_HOST_PORT") %>:3000"

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - ADMIN_PASS
    - ADMIN_USER
    - CLERK_SECRET_KEY
    - DATABASE_URL
    - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    - CLERK_PUBLISHABLE_KEY
    - NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    - RECAPTCHA_SECRET_KEY
    - RESEND_API_KEY
    - STORAGE_ACCESS_KEY_ID
    - STORAGE_BUCKET
    - STORAGE_ENDPOINT
    - STORAGE_FORCE_PATH_STYLE
    - STORAGE_REGION
    - STORAGE_SECRET_ACCESS_KEY
    - STORAGE_TOKEN
  clear:
    NODE_ENV: production
    NEXT_PUBLIC_APP_URL: <%= ENV.fetch("KAMAL_APP_URL") %>

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("KAMAL_SERVER") %>
    port: "127.0.0.1:<%= ENV.fetch("KAMAL_DATABASE_HOST_PORT") %>:5432"
    env:
      clear:
        POSTGRES_DB: <%= ENV.fetch("KAMAL_DATABASE_NAME") %>
        POSTGRES_USER: <%= ENV.fetch("KAMAL_DATABASE_USER") %>
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER") %>
  port: <%= ENV.fetch("KAMAL_SSH_PORT") %>

builder:
  arch: amd64
  secrets:
    - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    - CLERK_PUBLISHABLE_KEY
    - NEXT_PUBLIC_RECAPTCHA_SITE_KEY
