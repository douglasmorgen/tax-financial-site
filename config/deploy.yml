service: finance

image: douglasmorgen/finance

servers:
  web:
    hosts:
      - 174.127.79.77
    proxy: false
    options:
      publish:
        - "127.0.0.1:3001:3000"

registry:
  server: ghcr.io
  username: douglasmorgen
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - ADMIN_PASS
    - ADMIN_USER
    - CLERK_SECRET_KEY
    - DATABASE_URL
    - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    - NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    - RECAPTCHA_SECRET_KEY
    - STORAGE_ACCESS_KEY_ID
    - STORAGE_BUCKET
    - STORAGE_ENDPOINT
    - STORAGE_FORCE_PATH_STYLE
    - STORAGE_REGION
    - STORAGE_SECRET_ACCESS_KEY
    - STORAGE_TOKEN
  clear:
    NODE_ENV: production
    NEXT_PUBLIC_APP_URL: https://finance.dougmorgen.com

accessories:
  db:
    image: postgres:16
    host: 174.127.79.77
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_DB: finance_production
        POSTGRES_USER: finance
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

ssh:
  user: root
  port: "25463"

builder:
  arch: amd64